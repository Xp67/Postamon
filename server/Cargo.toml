[package]
description = "Postamon interno: chat e allegati fra i PC dell'azienda, senza internet"
name = "postamon-interno"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
futures = "0.3.34"
getrandom = "0.4.3"
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0.10"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio-tungstenite = "0.30.0"
